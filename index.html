<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f25">
  <title>Project Gridmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg: #05060a; --ink: #f2f3f4; --muted: #93979e;
      --font-mono: "IBM Plex Mono"; font-family: var(--font-mono), ui-monospace, Menlo, monospace; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
    body { -webkit-font-smoothing: antialiased; }
    /* A quiet, static ground: atmospheric depth stays behind the geography. */
    .ground { position: fixed; inset: 0; overflow: hidden; pointer-events: none; background: var(--bg); }
    .ground span { position: absolute; border-radius: 50%; }
    .navy { width: 190vmax; height: 100vmax; left: calc(12% - 95vmax); top: calc(10% - 50vmax);
      background: radial-gradient(closest-side, rgba(11,29,68,.40), rgba(11,29,68,.18) 55%, transparent); }
    .indigo { width: 180vmax; height: 90vmax; left: calc(98% - 90vmax); top: calc(48% - 45vmax);
      background: radial-gradient(closest-side, rgba(26,20,80,.32), rgba(26,20,80,.14) 55%, transparent); }
    .purple { width: 200vmax; height: 90vmax; left: calc(8% - 100vmax); top: calc(88% - 45vmax);
      background: radial-gradient(closest-side, rgba(24,23,48,.16), rgba(24,23,48,.06) 55%, transparent); }
    .deep { width: 160vmax; height: 70vmax; left: calc(88% - 80vmax); top: calc(100% - 35vmax);
      background: radial-gradient(closest-side, rgba(10,32,72,.24), rgba(10,32,72,.11) 55%, transparent); }
    #map { position: fixed; inset: 48px 16px 70px; touch-action: none; }
    .chrome { position: fixed; z-index: 1; font-size: 10px; letter-spacing: .16em; line-height: 1.9;
      text-transform: uppercase; color: var(--muted); }
    #crumbs { top: calc(16px + env(safe-area-inset-top)); left: calc(24px + env(safe-area-inset-left)); right: 24px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
      background: none; border: 0; padding: 0; cursor: pointer; }
    button:hover, button:focus-visible { color: var(--ink); }
    button:focus-visible { outline: 1px solid currentColor; outline-offset: 4px; }
    #crumbs span { padding: 0 .7em; }
    #info { bottom: calc(16px + env(safe-area-inset-bottom)); left: calc(24px + env(safe-area-inset-left)); }
    #info { right: 40%; }
    #info .path { display: flex; align-items: center; gap: .7em; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    #info .path button { flex: 0 0 auto; min-height: 28px; }
    #info .facts { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #crumbs button { min-height: 28px; }
    #info:empty { display: none; }
    #info .selected { color: var(--ink); }
    #hint { bottom: calc(16px + env(safe-area-inset-bottom)); right: 24px; pointer-events: none; text-align: right; max-width: 36%; }
    .gridmap-tooltip:empty { display: none; }
    @keyframes chapter-loading-pulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    [data-chapter-id][aria-busy="true"] [data-chapter-skeleton] {
      animation: chapter-loading-pulse 1.8s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      [data-chapter-id][aria-busy="true"] [data-chapter-skeleton] { animation: none; }
    }
    #zoom-tuner { top: 60px; right: 24px; width: 218px; padding: 10px 12px;
      border: 1px solid rgba(180,195,255,.18); background: rgba(11,14,24,.94); }
    #zoom-tuner[hidden] { display: none; }
    #zoom-tuner summary { cursor: pointer; }
    #zoom-tuner output { color: var(--ink); font-variant-numeric: tabular-nums; }
    #zoom-tuner label { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    #zoom-tuner input { width: 76px; min-height: 36px; box-sizing: border-box; font: inherit;
      color: var(--ink); background: transparent; border: 1px solid var(--muted); padding: 4px 6px; }
    #zoom-tuner button { display: block; min-height: 44px; text-decoration: underline; }
    #zoom-tuner p { font-size: 9px; letter-spacing: .05em; text-transform: none; margin: 0; }
    @media (max-width: 699px) {
      #map { inset: 60px 4px 98px; }
      #crumbs { left: 16px; right: 16px; }
      #info { left: 16px; right: 16px; bottom: calc(36px + env(safe-area-inset-bottom)); }
      #info .path button, #crumbs button { min-height: 44px; }
      #info .facts { line-height: 1.5; }
      #hint { left: 16px; right: 16px; text-align: left; max-width: none; }
      #zoom-tuner { top: 72px; right: 12px; }
    }
  </style>
</head>
<body>
  <div class="ground" aria-hidden="true"><span class="navy"></span><span class="indigo"></span><span class="purple"></span><span class="deep"></span></div>
  <div id="map" aria-label="Interactive Bible grid map"></div>
  <nav id="crumbs" class="chrome" aria-label="Map focus"></nav>
  <div id="info" class="chrome" aria-live="polite"></div>
  <div id="hint" class="chrome"></div>
  <details id="zoom-tuner" class="chrome" hidden>
    <summary>Zoom <output id="zoom-current">1.00×</output></summary>
    <label>Text from <input id="text-zoom" type="number" min="0" step="0.1" value="0" aria-label="Chapter text reveal zoom factor">×</label>
    <button id="zoom-use-current" type="button">Use current zoom</button>
    <p>1× = whole-map overview.<br>0 = automatic. Manual values reveal compact text that grows with zoom.</p>
  </details>
  <script type="module" src="./demo/main.js"></script>
</body>
</html>
