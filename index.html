<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Gridmap</title>
<meta name="theme-color" content="#0a0b0c">
<!-- A single chapter cell with its star, inline so there's no extra file. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0b0c'/%3E%3Crect x='5.5' y='5.5' width='21' height='21' fill='none' stroke='%23d9d5cd' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23f2efe8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0b0c;
    --ink:      #f2efe8;   /* stars, strongest lines, primary text */
    --ink-2:    #a19d94;   /* secondary text */
    --ink-3:    #5c5954;   /* faint text */
    --line-ch:  #2a2c2e;   /* chapter boundaries: fine */
    --line-bk:  #7d7a74;   /* book boundaries: medium */
    --line-dv:  #aeaaa2;   /* division boundaries: stronger */
    --line-ts:  #d9d5cd;   /* testament boundaries: strongest */
    --font: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --label-px: 9px;       /* book labels; larger on touch screens */
    --chrome-px: 10px;
  }
  @media (pointer: coarse) {
    :root { --label-px: 11px; --chrome-px: 11px; }
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  /* The map takes every gesture itself: pinch, pan, press. */
  svg#map { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  svg#map.over-chapter { cursor: pointer; }
  svg#map.panning { cursor: grabbing; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  /* The world is painted on this canvas (see paint()); the SVG above it
     holds only screen-space labels and rings, and takes the gestures. */
  #world-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* screen-space overlay: labels and star emphasis */
  #overlay text { font-family: var(--font); pointer-events: none; }
  .book-label {
    font-size: var(--label-px); letter-spacing: .14em; fill: var(--c, var(--ink)); opacity: .72;
    dominant-baseline: central; transition: opacity 180ms;
  }
  .label-bg { fill: var(--bg); }
  .book-label.hover, .book-label.selected { opacity: 1; }
  .testament-label {
    font-size: calc(var(--label-px) + .5px); letter-spacing: .32em; fill: var(--ink-2);
    text-anchor: middle; transition: fill 250ms;
  }
  .testament-label.selected { fill: var(--ink); }
  .chapter-num { font-size: calc(var(--label-px) + 1px); fill: var(--ink-3); }
  .chapter-num.selected { fill: var(--ink); }
  #hover-star  { fill: var(--c, var(--ink)); }
  #hover-halo  { fill: none; stroke: var(--c, var(--ink)); stroke-opacity: .35; }
  #sel-ring    { fill: none; stroke: var(--c, var(--ink)); stroke-width: 1; }
  body.no-marks :is(#hover-star, #hover-halo, #sel-ring, #chapter-nums) { display: none; }

  /* chrome: almost none */
  .chrome { position: fixed; font-size: var(--chrome-px); letter-spacing: .22em; text-transform: uppercase; line-height: 1.9; }
  /* Top-left stack: the game's clue (when playing), then the breadcrumbs. */
  #top { position: fixed; top: calc(18px + env(safe-area-inset-top)); left: calc(24px + env(safe-area-inset-left));
    right: calc(24px + env(safe-area-inset-right)); pointer-events: none; }
  #top > * { pointer-events: auto; width: fit-content; }
  #crumbs { position: static; color: var(--ink-3); }
  /* Chrome sits on a patch of background, like the book labels, so it stays
     legible when the map is zoomed underneath it. */
  #crumbs, #info { background: var(--bg); padding: 0 8px; margin-left: -8px; max-width: calc(100vw - 48px); }
  #info:empty { display: none; }
  #crumbs span { cursor: pointer; transition: color 150ms; }
  #crumbs span:hover, #crumbs span.current { color: var(--ink-2); }
  #crumbs span.current, #crumbs span.static { cursor: default; }
  #crumbs span.static:hover { color: inherit; }
  #crumbs i { font-style: normal; padding: 0 .7em; }
  #info { bottom: calc(18px + env(safe-area-inset-bottom)); left: calc(24px + env(safe-area-inset-left)); }
  #info div:nth-child(1) { color: var(--ink-3); }
  #info div:nth-child(2), #info div:nth-child(3) { color: var(--ink-2); }
  #info div:nth-child(4) { color: var(--ink); }
  #info [data-go] { cursor: pointer; transition: color 150ms; }
  #info [data-go]:hover { color: var(--ink); }
  #hint { bottom: calc(18px + env(safe-area-inset-bottom)); right: calc(24px + env(safe-area-inset-right));
    color: var(--ink-2); text-align: right; transition: opacity 300ms; pointer-events: none; }
  #hint.away { opacity: 0; }

  /* Touch: bigger targets for the chrome that can be tapped. */
  @media (pointer: coarse) {
    .chrome { line-height: 2.3; }
    #crumbs span { display: inline-block; padding: 2px 0; }
  }
  /* Short (phone landscape): the selection info folds onto one line. */
  @media (max-height: 499px) {
    .chrome { line-height: 1.9; }
    #top { top: calc(8px + env(safe-area-inset-top)); }
    #info, #hint { bottom: calc(8px + env(safe-area-inset-bottom)); }
    #info div { display: inline; }
    #info div + div::before { content: ' · '; color: var(--ink-3); }
  }
  /* Narrow (phone portrait): tighter margins; the hint sits where the
     selection info will later appear. */
  @media (max-width: 699px) {
    #top { left: calc(16px + env(safe-area-inset-left)); right: 16px; top: calc(12px + env(safe-area-inset-top)); }
    #info { left: calc(16px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom)); }
    #hint { left: calc(16px + env(safe-area-inset-left)); right: 16px; bottom: calc(12px + env(safe-area-inset-bottom)); text-align: left; }
  }

  /* ---- Game (proof of concept) ----
     Clue top-left; guesses and the Guess button bottom-left (a full-width
     tray on phones). Feedback is shape, not colour: the division colours
     already use green and yellow. */
  #game-head, #game-tray { display: none; }
  body.game #game-head, body.game #game-tray { display: block; }
  body.game #info, body.game #hint { display: none; }
  #game-head { background: var(--bg); padding: 0 8px 6px; margin-left: -8px; }
  .game-meta { font-size: var(--chrome-px); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); line-height: 1.9; }
  .clue { font-size: 20px; line-height: 1.35; color: var(--ink); max-width: 30ch; margin: 2px 0 0; text-wrap: balance; }
  .clue::before { content: '\201C'; } .clue::after { content: '\201D'; }
  .answer { font-size: var(--chrome-px); letter-spacing: .22em; text-transform: uppercase; color: var(--c, var(--ink)); line-height: 2.2; }
  .answer:empty { display: none; }

  #game-tray {
    position: fixed; left: calc(24px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom));
    width: 17rem; background: var(--bg); padding: 6px 8px 0; margin-left: -8px;
    font-size: var(--chrome-px); letter-spacing: .16em; text-transform: uppercase;
  }
  .guess-row { display: grid; grid-template-columns: 1fr auto 8.5em; align-items: center; gap: 12px; height: 24px; color: var(--ink-2); white-space: nowrap; }
  .guess-row.empty { color: var(--ink-3); }
  .guess-row.found { color: var(--ink); }
  .guess-row.legend { height: 16px; color: var(--ink-3); }
  .guess-row .dir { text-align: right; }
  .fb { display: inline-block; width: 9px; height: 9px; margin-left: 5px; border: 1px solid var(--ink-2); vertical-align: middle; }
  .fb.yes { background: var(--ink); border-color: var(--ink); }
  .guess-row.empty .fb { border-color: var(--line-ch); }
  .legend span span { display: inline-block; width: 11px; margin-left: 5px; text-align: center; }
  #guess-btn {
    display: block; width: 100%; min-height: 42px; margin: 10px 0 0; padding: 0 12px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--ink-2); border-radius: 0;
    font: inherit; letter-spacing: .2em; text-transform: uppercase; cursor: pointer;
  }
  #guess-btn:hover:not(:disabled) { border-color: var(--ink); }
  #guess-btn:disabled { color: var(--ink-3); border-color: var(--line-ch); cursor: default; }
  .legend-caption { display: none; color: var(--ink-3); line-height: 1.9; }
  @media (max-width: 699px) {
    .clue { font-size: 17px; }
    #game-tray { left: calc(16px + env(safe-area-inset-left)); right: calc(16px + env(safe-area-inset-right));
      bottom: calc(10px + env(safe-area-inset-bottom)); width: auto; }
    /* Phones: guesses in two columns, direction as an arrow alone. */
    #guess-rows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
    .guess-row { grid-template-columns: 1fr auto 1.2em; gap: 8px; height: 26px; }
    .guess-row.legend, .guess-row .w { display: none; }
    .legend-caption { display: block; grid-column: 1 / -1; }
  }
  @media (max-height: 499px) {
    .clue { font-size: 16px; }
    #game-tray { bottom: calc(8px + env(safe-area-inset-bottom)); }
    .guess-row { height: 20px; }
    #guess-btn { min-height: 34px; margin-top: 6px; }
  }

  #tooltip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity 120ms;
    font-size: var(--chrome-px); letter-spacing: .16em; text-transform: uppercase; line-height: 1.6;
    padding: 5px 8px; background: var(--bg); border-left: 1px solid var(--line-bk);
  }
  #tooltip.on { opacity: 1; }
  #tooltip .d { color: var(--ink-2); }
  #tooltip .b { color: var(--c, var(--ink)); }
</style>
</head>
<body>

<canvas id="world-canvas"></canvas>
<svg id="map" xmlns="http://www.w3.org/2000/svg">
  <g id="overlay">
    <g id="testament-labels"></g>
    <g id="book-labels"></g>
    <g id="chapter-nums"></g>
    <circle id="hover-halo" r="9" visibility="hidden"/>
    <circle id="hover-star" r="3" visibility="hidden"/>
    <circle id="sel-ring"   r="8" visibility="hidden"/>
  </g>
</svg>

<div id="top">
  <header id="game-head">
    <div class="game-meta" id="game-meta"></div>
    <p class="clue" id="clue"></p>
    <div class="answer" id="answer"></div>
  </header>
  <nav id="crumbs" class="chrome"></nav>
</div>
<div id="game-tray">
  <div id="guess-rows"></div>
  <button id="guess-btn" type="button"></button>
</div>
<div id="info" class="chrome"></div>
<div id="hint" class="chrome"></div>
<div id="safe"></div>
<div id="tooltip"><div class="d"></div><div class="b"></div></div>

<script>
'use strict';

/* =====================================================================
   0. CONFIG
   ===================================================================== */

const CONFIG = {
  centreMark: 'number',   // what marks each chapter's centre: 'number' (its chapter number) or 'star' (a point)
  showMarks: true,        // show the centre marks at all
  markOpacity: 0.5,       // 0–1: brightness of the centre marks
  relativeMarkSize: true, // larger chapters (more verses) get a larger mark
  markMaxSize: 0.4,       // 0–1: the largest a chapter number may be, as a share of its cell
  numberMinPx: 8,         // numbers replace stars once a typical chapter's number is this big on screen
  game: {
    enabled: false,        // show the Bible Game (clue, guesses) on top of the map
    maxGuesses: 5,
    dimRuledOut: true,    // dim every chapter the guesses so far have ruled out
  },
  bookLabels: 'short', // book names on the map: 'full' (Genesis) or 'short' (GEN)
  colours: true,       // colour book borders, stars and names from colours.json
};

/* =====================================================================
   1. BIBLE DATA
   The 66-book Protestant canon, from bible.json.
   ===================================================================== */

// Loaded from bible.json and reduced to what the map needs, keeping the
// structure: [{ id, name, divisions: [{ id, name, books: [{ key, name,
// chapters, verses }] }] }], in canonical order. bible.json is the only
// source of structure (colours.json never implies membership).
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

async function loadBible(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: ${res.status}`);
  const json = await res.json();
  return json.testaments.map((t) => ({
    id: `${t.name[0]}T`,
    name: `${t.name} Testament`,
    divisions: t.divisions.map((d) => ({
      id: slug(d.name),
      name: d.name,
      books: d.books.map(({ key, name, chapters, verses }) => ({ key, name, chapters, verses })),
    })),
  }));
}

// A testament's books in canonical order, each carrying its division.
const booksOf = (t) => t.divisions.flatMap((d) =>
  d.books.map((b) => ({ ...b, divisionId: d.id, divisionName: d.name })));


// Book colours from colours.json: { GEN: '#c6feff', ... }. Presentation
// only, so it stays out of the geometry model. Optional: without it the
// map is monochrome.
let COLOURS = {};

async function loadColours(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url}: ${res.status}`);
    return await res.json();
  } catch (err) {
    console.warn('No book colours:', err.message);
    return {};
  }
}

const colourOf = (book) => (CONFIG.colours && book && COLOURS[book.key]) || null;

// Hand a book's colour to an element as --c (or clear it).
function tint(el, book) {
  const c = colourOf(book);
  if (c) el.style.setProperty('--c', c); else el.style.removeProperty('--c');
}


/* =====================================================================
   2. LAYOUT
   Pure functions: data in, rectangles out. No DOM.

   The world is a fixed rectangle, independent of the screen, so every
   chapter has one permanent position.

   - Testaments are stacked top to bottom, height ∝ chapter count, so a
     chapter has the same area everywhere in the Bible.
   - Books are placed by recursive ordered binary partition (a Mondrian-
     like subdivision): every cut preserves canonical order, reading
     left→right and top→bottom at each level.
   - Each book is divided into rows of equal-area chapter cells, again in
     reading order.
   - Divisions play no part in the partition: books are laid out as one
     ordered list per testament and merely carry their division identity.
   ===================================================================== */

// Two canonical worlds, one per screen shape: portrait (phones, first) and
// landscape (desktop). Each is fixed and deterministic, so a chapter has
// one permanent position within each; its identity across both is its id
// (e.g. GEN.12). The portrait shape suits a phone's usable screen.
const WORLDS = {
  portrait:  { x: 0, y: 0, width: 1000, height: 1900, gutter: 30 },
  landscape: { x: 0, y: 0, width: 1600, height: 1000, gutter: 30 },
};

// Split n chapters into r rows whose counts differ by at most one.
function rowCounts(n, r) {
  const base = Math.floor(n / r), extra = n % r;
  return Array.from({ length: r }, (_, i) => base + (i >= r - extra ? 1 : 0));
}

// How far from square the chapter cells of an n-chapter book in a w×h
// region would be, if split into r rows. Sum over chapters of log-aspect²,
// plus a term for the single worst cell so small books don't become slivers.
function gridCost(n, w, h, r) {
  let sum = 0, worst = 0;
  for (const c of rowCounts(n, r)) {
    const e = Math.log((w / c) / (h * c / n)) ** 2;
    sum += c * e;
    worst = Math.max(worst, e);
  }
  return sum + 2 * worst;
}

function bestGrid(n, w, h) {
  let best = { rows: 1, cost: Infinity };
  for (let r = 1; r <= n; r++) {
    const cost = gridCost(n, w, h, r);
    if (cost < best.cost) best = { rows: r, cost };
  }
  return best;
}

// Cut a rectangle across its longer side; fraction f goes first
// (left or top), so reading order is always left→right, top→bottom.
function cut(r, f) {
  return r.width >= r.height
    ? [{ x: r.x, y: r.y, width: r.width * f, height: r.height },
       { x: r.x + r.width * f, y: r.y, width: r.width * (1 - f), height: r.height }]
    : [{ x: r.x, y: r.y, width: r.width, height: r.height * f },
       { x: r.x, y: r.y + r.height * f, width: r.width, height: r.height * (1 - f) }];
}

// Recursive ordered binary partition. The ordered list of books is split
// in two near the middle of its chapter weight; each half takes its share
// of the rectangle. Of the few most balanced split points, keep the one
// whose finished subtree gives the most square chapter cells.
const SPLIT_CANDIDATES = 3;
const chapterSum = (books) => books.reduce((s, b) => s + b.n, 0);

function partitionBooks(books, rect) {
  if (books.length === 1) {
    return { cost: bestGrid(books[0].n, rect.width, rect.height).cost, regions: [{ ...books[0], rect }] };
  }
  const total = chapterSum(books);
  const splits = [];
  for (let k = 1, acc = 0; k < books.length; k++) {
    acc += books[k - 1].n;
    splits.push({ k, imbalance: Math.abs(acc - total / 2) });
  }
  splits.sort((a, b) => a.imbalance - b.imbalance || a.k - b.k);

  let best = null;
  for (const { k } of splits.slice(0, SPLIT_CANDIDATES)) {
    const first = books.slice(0, k), rest = books.slice(k);
    const [ra, rb] = cut(rect, chapterSum(first) / total);
    const a = partitionBooks(first, ra), b = partitionBooks(rest, rb);
    if (!best || a.cost + b.cost < best.cost) {
      best = { cost: a.cost + b.cost, regions: [...a.regions, ...b.regions] };
    }
  }
  return best;
}

// Divide a book's rectangle into chapter cells, in reading order.
function layoutChapters(n, x, y, w, h) {
  const cells = [];
  let cy = y;
  for (const c of rowCounts(n, bestGrid(n, w, h).rows)) {
    const rh = h * c / n;
    for (let i = 0; i < c; i++) cells.push({ x: x + w * i / c, y: cy, width: w / c, height: rh });
    cy += rh;
  }
  return cells;
}

function layoutBible(bible, world) {
  const total = bible.reduce((s, t) => s + booksOf(t).reduce((a, b) => a + b.chapters, 0), 0);
  const usableH = world.height - world.gutter * (bible.length - 1);
  const testaments = [], books = [], chapters = [];
  let ty = world.y;

  bible.forEach((t) => {
    const items = booksOf(t).map(({ chapters, ...b }) => ({ ...b, n: chapters }));
    const tRect = { x: world.x, y: ty, width: world.width, height: usableH * chapterSum(items) / total };
    const testament = { id: t.id, name: t.name, ...tRect, books: [] };
    testaments.push(testament);

    for (const { key, name, n, verses, divisionId, divisionName, rect } of partitionBooks(items, tRect).regions) {
      const book = {
        index: books.length, testament: t.name, testamentId: t.id, division: divisionName, divisionId,
        key, name, chapterCount: n, ...rect, chapters: [],
      };
      layoutChapters(n, rect.x, rect.y, rect.width, rect.height).forEach((cell, i) => {
        const chapter = {
          index: chapters.length, testament: t.name, testamentId: t.id, division: divisionName, divisionId,
          book: name, bookKey: key, bookIndex: book.index, chapter: i + 1,
          verses: verses?.[i] ?? null,
          ...cell, centerX: cell.x + cell.width / 2, centerY: cell.y + cell.height / 2,
        };
        book.chapters.push(chapter);
        chapters.push(chapter);
      });
      testament.books.push(book);
      books.push(book);
    }
    ty += tRect.height + world.gutter;
  });

  return { world, testaments, books, chapters };
}


/* =====================================================================
   3. GEOMETRY / MODEL
   The complete, renderer-agnostic world. Each chapter looks like:
   { testament, division, book, chapter, x, y, width, height, centerX, centerY, ... }

   Divisions are semantic regions derived AFTER layout: a division is the
   union of its books' existing rectangles, so it may be an irregular
   orthogonal shape. `bounds` is only its bounding box, for camera framing.
   ===================================================================== */

let MODEL;   // built at start-up, once bible.json has loaded

// --- Region geometry: a region is a set of non-overlapping axis-aligned
//     rectangles that may touch along their edges. ---

const EPS = 1e-6;
const near = (a, b) => Math.abs(a - b) < EPS;

function boundsOf(rects) {
  const x = Math.min(...rects.map((r) => r.x)), y = Math.min(...rects.map((r) => r.y));
  const x2 = Math.max(...rects.map((r) => r.x + r.width)), y2 = Math.max(...rects.map((r) => r.y + r.height));
  return { x, y, width: x2 - x, height: y2 - y };
}

// The parts of [lo, hi] not covered by any of the intervals in `cuts`.
function subtractIntervals(lo, hi, cuts) {
  const pieces = [];
  let cur = lo;
  for (const [a, b] of [...cuts].sort((p, q) => p[0] - q[0])) {
    if (b <= cur + EPS) continue;
    if (a > cur + EPS) pieces.push([cur, Math.min(a, hi)]);
    cur = Math.max(cur, b);
    if (cur >= hi - EPS) break;
  }
  if (cur < hi - EPS) pieces.push([cur, hi]);
  return pieces.filter(([a, b]) => b - a > EPS);
}

// The outer boundary of a region, as axis-aligned segments { x1, y1, x2, y2 }:
// every rectangle side, minus the stretches where another rectangle of the
// same region lies directly on the other side (those are internal edges).
function regionOutline(rects) {
  const segments = [];
  for (const r of rects) {
    const left = r.x, right = r.x + r.width, top = r.y, bottom = r.y + r.height;
    const sides = [   // where the side lies, its extent, and which edge of a neighbour would meet it
      { at: top,    lo: left, hi: right,  horizontal: true,  meets: (o) => o.y + o.height },
      { at: bottom, lo: left, hi: right,  horizontal: true,  meets: (o) => o.y },
      { at: left,   lo: top,  hi: bottom, horizontal: false, meets: (o) => o.x + o.width },
      { at: right,  lo: top,  hi: bottom, horizontal: false, meets: (o) => o.x },
    ];
    for (const side of sides) {
      const covered = rects
        .filter((o) => o !== r && near(side.meets(o), side.at))
        .map((o) => (side.horizontal ? [o.x, o.x + o.width] : [o.y, o.y + o.height]));
      for (const [a, b] of subtractIntervals(side.lo, side.hi, covered)) {
        segments.push(side.horizontal
          ? { x1: a, y1: side.at, x2: b, y2: side.at }
          : { x1: side.at, y1: a, x2: side.at, y2: b });
      }
    }
  }
  return segments;
}

// Does a segment lie on the perimeter of rectangle r?
function onPerimeter(sg, r) {
  return sg.y1 === sg.y2
    ? near(sg.y1, r.y) || near(sg.y1, r.y + r.height)
    : near(sg.x1, r.x) || near(sg.x1, r.x + r.width);
}

// Layout, then the semantic regions derived from it. Divisions never
// influence a single coordinate: they are read off the finished geometry.
function buildModel(bible, world) {
  const model = layoutBible(bible, world);
  model.divisions = [];
  for (const t of bible) {
    const testament = model.testaments.find((x) => x.id === t.id);
    testament.divisions = [];
    for (const d of t.divisions) {
      const books = testament.books.filter((b) => b.divisionId === d.id);
      const division = {
        index: model.divisions.length, id: d.id, name: d.name,
        testament: t.name, testamentId: t.id, books,
        bounds: boundsOf(books),
        // Outer edges; those not on the testament's own border separate
        // this division from a neighbouring one.
        outline: regionOutline(books).map((sg) => ({ ...sg, betweenDivisions: !onPerimeter(sg, testament) })),
      };
      for (const b of books) {
        b.divisionIndex = division.index;
        for (const c of b.chapters) c.divisionIndex = division.index;
      }
      testament.divisions.push(division);
      model.divisions.push(division);
    }
  }
  return model;
}

function checkModel(model, bible) {
  console.assert(model.testaments.length === 2, 'expected 2 testaments');
  console.assert(model.books.length === 66, 'expected 66 books');
  console.assert(model.chapters.length === 1189, 'expected 1,189 chapters');
  console.assert(model.testaments[0].books.reduce((s, b) => s + b.chapterCount, 0) === 929, 'OT should have 929 chapters');
  console.assert(model.testaments[1].books.reduce((s, b) => s + b.chapterCount, 0) === 260, 'NT should have 260 chapters');

  // Division integrity: exactly bible.json's divisions, in order; every book
  // in exactly one; every chapter inheriting its book's; outlines enclose.
  const expected = bible.flatMap((t) => t.divisions.map((d) => `${t.id}/${d.id}:${d.books.map((b) => b.key).join(',')}`));
  const actual = model.divisions.map((d) => `${d.testamentId}/${d.id}:${d.books.map((b) => b.key).join(',')}`);
  console.assert(expected.join('|') === actual.join('|'), 'divisions should match bible.json exactly');
  console.assert(new Set(model.divisions.map((d) => d.id)).size === model.divisions.length, 'division ids should be unique');
  const inDivisions = model.divisions.flatMap((d) => d.books);
  console.assert(inDivisions.length === model.books.length && inDivisions.every((b, i) => b === model.books[i]),
    'every book should belong to exactly one division, in canonical order');
  console.assert(model.chapters.every((c) => {
    const b = model.books[c.bookIndex], d = model.divisions[c.divisionIndex];
    return d && c.divisionId === b.divisionId && d.id === b.divisionId && d.books.includes(b);
  }), 'every chapter should inherit exactly its book\'s division');
  for (const d of model.divisions) {
    const B = d.bounds;
    console.assert(d.books.every((b) => b.x >= B.x - EPS && b.y >= B.y - EPS &&
      b.x + b.width <= B.x + B.width + EPS && b.y + b.height <= B.y + B.height + EPS), `${d.name}: bounds should contain its books`);
    console.assert(d.outline.length >= 4, `${d.name}: should have an outline`);
    // An outer edge has its own division on exactly one side.
    const inside = (x, y) => d.books.some((b) => x > b.x && x < b.x + b.width && y > b.y && y < b.y + b.height);
    console.assert(d.outline.every((sg) => {
      const mx = (sg.x1 + sg.x2) / 2, my = (sg.y1 + sg.y2) / 2, h = sg.y1 === sg.y2, e = .01;
      return inside(h ? mx : mx - e, h ? my - e : my) !== inside(h ? mx : mx + e, h ? my + e : my);
    }), `${d.name}: outline should separate inside from outside`);
  }

  const noVerses = model.chapters.filter((c) => !c.verses).map((c) => `${c.bookKey} ${c.chapter}`);
  if (noVerses.length) console.warn('No verse count for:', noVerses.join(', '));
}

// Pointer → chapter lookup, in world coordinates.
function chapterAt(x, y) {
  if (!MODEL) return null;
  for (const b of MODEL.books) {
    if (x < b.x || x >= b.x + b.width || y < b.y || y >= b.y + b.height) continue;
    for (const c of b.chapters) {
      if (x >= c.x && x < c.x + c.width && y >= c.y && y < c.y + c.height) return c;
    }
  }
  return null;
}


/* =====================================================================
   4. VIEWPORT / CAMERA
   The camera is the only thing that moves. screen = world·k + offset,
   with the world point (cx, cy) at the centre of the screen. It flies
   between focus targets, or moves freely under pinch, drag and wheel.
   ===================================================================== */

const camera = { cx: 0, cy: 0, k: 1, free: false };   // free: moved by hand since the last flight
const viewport = { w: innerWidth, h: innerHeight };
const COARSE = matchMedia('(pointer: coarse)').matches;
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

const toScreenX = (x) => (x - camera.cx) * camera.k + viewport.w / 2;
const toScreenY = (y) => (y - camera.cy) * camera.k + viewport.h / 2;
const toWorldX  = (sx) => (sx - viewport.w / 2) / camera.k + camera.cx;
const toWorldY  = (sy) => (sy - viewport.h / 2) / camera.k + camera.cy;

// Portrait screens get the portrait world, wide screens the landscape one.
const layoutFor = () => (viewport.h > viewport.w ? 'portrait' : 'landscape');
const isNarrow = () => viewport.w < 700;

// Screen space kept clear for the chrome and the device's safe areas.
// Narrow (phone portrait): room below for the stacked selection info.
// Short (phone landscape): the info is one line, so keep margins slim.
// The device's safe-area margins, read from CSS. Reading computed styles
// forces a layout, so this is done on start-up and resize only, never per
// frame (insets() runs every frame via frame() and clampK()).
const safeArea = { top: 0, right: 0, bottom: 0, left: 0 };
function measureSafeArea() {
  const cs = getComputedStyle(document.getElementById('safe'));
  const px = (v) => parseFloat(v) || 0;
  Object.assign(safeArea, { top: px(cs.paddingTop), right: px(cs.paddingRight), bottom: px(cs.paddingBottom), left: px(cs.paddingLeft) });
}

function insets() {
  const base = isNarrow() ? { top: 48, right: 14, bottom: 110, left: 34 }   // left: testament labels
    : viewport.h < 500 ? { top: 38, right: 20, bottom: 36, left: 40 }
    : { top: 64, right: 64, bottom: 104, left: 64 };
  const i = {
    top: base.top + safeArea.top, right: base.right + safeArea.right,
    bottom: base.bottom + safeArea.bottom, left: base.left + safeArea.left,
  };
  // The game's clue sits above the map; its tray below it on phones, or
  // beside it (left) on wider screens.
  if (gameChrome) {
    i.top = Math.max(i.top, gameChrome.top);
    if (gameChrome.below) i.bottom = Math.max(i.bottom, gameChrome.bottom);
    else i.left = Math.max(i.left, gameChrome.left);
  }
  return i;
}
let gameChrome = null;   // measured screen space taken by the game's chrome

// Camera that centres a world rectangle in the clear part of the screen.
// `extra` adds breathing room; `fill` caps how much of the screen it may
// occupy so tiny books keep some surrounding world.
function frame(rect, { extra = 0, fill = 1 } = {}) {
  const i = insets(), e = extra * (isNarrow() ? .5 : 1);
  const t = i.top + e, r = i.right + e, b = i.bottom + e, l = i.left + e;
  const availW = Math.max(1, viewport.w - l - r), availH = Math.max(1, viewport.h - t - b);
  const k = Math.min(availW / rect.width, availH / rect.height,
                     (viewport.w * fill) / rect.width, (viewport.h * fill) / rect.height);
  return { cx: rect.x + rect.width / 2 + (r - l) / 2 / k, cy: rect.y + rect.height / 2 + (b - t) / 2 / k, k };
}

// Free movement stays within sensible bounds: from a little smaller than
// the whole Bible to one chapter nearly filling the screen.
function clampK(k) {
  const min = frame(MODEL.world).k * .6;
  const max = Math.min(viewport.w, viewport.h) * .9 / MODEL.chapterSide;
  return Math.min(Math.max(k, min), max);
}
function setCamera(cx, cy, k) {
  const w = MODEL.world;
  camera.k = clampK(k);
  camera.cx = Math.min(Math.max(cx, w.x), w.x + w.width);
  camera.cy = Math.min(Math.max(cy, w.y), w.y + w.height);
  camera.free = true;
  renderCamera();
}
// Zoom to scale k while keeping the world point under (sx, sy) fixed there.
function zoomAround(sx, sy, wx, wy, k) {
  k = clampK(k);
  setCamera(wx - (sx - viewport.w / 2) / k, wy - (sy - viewport.h / 2) / k, k);
}

let flight = null;
function flyTo(target, duration = REDUCED_MOTION ? 0 : 850) {
  cancelAnimationFrame(flight);
  camera.free = false;
  if (!duration) { Object.assign(camera, target); renderNow(); refreshHover(); return; }
  const from = { ...camera }, t0 = performance.now();
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
  const step = (now) => {
    const t = Math.min(1, (now - t0) / duration), e = ease(t);
    camera.k  = from.k * (target.k / from.k) ** e;       // zoom geometrically
    camera.cx = from.cx + (target.cx - from.cx) * e;
    camera.cy = from.cy + (target.cy - from.cy) * e;
    renderNow();
    if (t < 1) flight = requestAnimationFrame(step);
    else refreshHover();                                // the world moved under the pointer
  };
  flight = requestAnimationFrame(step);
}


/* =====================================================================
   5. RENDERING
   The world (grid, borders, marks, highlights, veils) is painted onto a
   single <canvas>, only what is on screen, at most once per animation
   frame. There is no per-chapter DOM for the browser to restyle or lay
   out, which is what keeps pinch and pan smooth on phones. Labels, rings
   and the chrome stay in a thin screen-space SVG overlay above it, and
   reveal themselves as the camera gets close enough to read them.
   ===================================================================== */

const $ = (id) => document.getElementById(id);
const SVG_NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs = {}, parent) => {
  const el = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
};

// Relative mark size: a mark's AREA is proportional to verse count, so a
// 176-verse Psalm 119 is ~2.7× the size of a typical (median) chapter's and
// a 2-verse Psalm 117 shrinks to a floor. 1 when switched off.
let medianVerses = 1;
function markScale(c, floor) {
  if (!CONFIG.relativeMarkSize || !c.verses) return 1;
  return Math.max(floor, Math.sqrt(c.verses / medianVerses));
}
const starScale = (c) => markScale(c, .4);

// A chapter number's size in world units. The longest chapters (the top 1%
// by verses) reach CONFIG.markMaxSize of the cell; the rest scale down from
// there with area ∝ verses, so the contrast is kept rather than clipped.
// Never smaller than a floor, never wider than fits (three-digit Psalms).
let referenceVerses = 1;           // verse count that earns the full size
const DIGIT_EM = .6;               // IBM Plex Mono's advance, in ems
function numberSize(c) {
  const share = CONFIG.relativeMarkSize && c.verses
    ? Math.min(1, Math.max(.35, Math.sqrt(c.verses / referenceVerses)))
    : .7;
  return Math.min(Math.min(c.width, c.height) * CONFIG.markMaxSize * share,
                  c.width * .7 / (String(c.chapter).length * DIGIT_EM));
}
const useNumbers = () => CONFIG.centreMark === 'number';

// Numbers are only shown where they can be read: below CONFIG.numberMinPx
// (for a typical chapter) the star stands in. Switching back to stars waits
// until a little below that, so a pinch resting on the threshold doesn't
// flicker. Numbers stop growing once a typical one reaches NUMBER_MAX_PX.
const NUMBER_HYSTERESIS_PX = .75, NUMBER_MAX_PX = 24;
let numbersOn = false;
function updateMarkMode() {
  if (!useNumbers()) { numbersOn = false; return; }
  const typicalPx = medianNumberSize * camera.k;
  numbersOn = numbersOn ? typicalPx >= CONFIG.numberMinPx - NUMBER_HYSTERESIS_PX : typicalPx >= CONFIG.numberMinPx;
}
// Stars grow a little as you approach, but stay stars (CSS px diameter).
const starDot = () => Math.min(7, 3 * (camera.k / frame(MODEL.world).k) ** .28);
// Numbers grow with the map until a typical one reaches NUMBER_MAX_PX.
const numberDamping = () => Math.min(1, NUMBER_MAX_PX / (medianNumberSize * camera.k));

// Per-layout values the painter needs, prepared once per layout.
const prepared = { fs: [], s: [], divisionSegments: [] };
let medianNumberSize = 1;
function prepareWorld(model) {
  const counts = model.chapters.map((c) => c.verses).filter(Boolean).sort((a, b) => a - b);
  if (counts.length) {
    medianVerses = counts[counts.length >> 1];
    referenceVerses = counts[Math.floor((counts.length - 1) * .99)];
  }
  prepared.fs = model.chapters.map(numberSize);
  prepared.s = model.chapters.map(starScale);
  // Only the edges where one division meets another are promoted; edges
  // between books of the same division stay ordinary book boundaries.
  prepared.divisionSegments = model.divisions.flatMap((d) => d.outline.filter((sg) => sg.betweenDivisions));
  const sizes = [...prepared.fs].sort((a, b) => a - b);
  medianNumberSize = sizes[sizes.length >> 1];
}

// --- Palette: the CSS custom properties, read once ---

const palette = {};
function readPalette() {
  const cs = getComputedStyle(document.documentElement);
  for (const name of ['bg', 'ink', 'line-ch', 'line-bk', 'line-dv', 'line-ts', 'font']) {
    palette[name] = cs.getPropertyValue(`--${name}`).trim();
  }
}

// --- Fades: what CSS transitions did for the SVG, done per frame ---

const fades = new Map();
function fade(name, target, ms) {
  const now = performance.now();
  let f = fades.get(name);
  if (!f) fades.set(name, f = { value: target, from: target, target, t0: now, ms });
  if (f.target !== target) Object.assign(f, { from: f.value, target, t0: now, ms });
  const p = REDUCED_MOTION || !f.ms ? 1 : Math.min(1, (now - f.t0) / f.ms);
  f.value = f.from + (f.target - f.from) * p;
  if (p < 1) renderCamera();                  // keep painting until it settles
  return f.value;
}
// What a fading-out highlight was showing, so it can fade rather than vanish.
const lastShown = {};
const remember = (key, value) => (value ? (lastShown[key] = value) : lastShown[key]);

// --- Canvas ---

const canvas = $('world-canvas');
const ctx = canvas.getContext('2d');
let dpr = 1;
function sizeCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(viewport.w * dpr);
  canvas.height = Math.round(viewport.h * dpr);
}

// Layers painted by things built on the map (the game), just under the veil.
const worldLayers = [];

function paint() {
  const k = camera.k, W = viewport.w, H = viewport.h;
  const ox = W / 2 - camera.cx * k, oy = H / 2 - camera.cy * k;
  const X = (x) => x * k + ox, Y = (y) => y * k + oy;
  const rect = (r) => ctx.rect(X(r.x), Y(r.y), r.width * k, r.height * k);
  // The world rectangle currently on screen, for culling.
  const wx0 = -ox / k, wy0 = -oy / k, wx1 = (W - ox) / k, wy1 = (H - oy) / k;
  const onScreen = (r) => r.x < wx1 && r.x + r.width > wx0 && r.y < wy1 && r.y + r.height > wy0;
  const books = MODEL.books.filter(onScreen);
  const colour = (b, fallback) => colourOf(b) || fallback;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.setLineDash([]);

  // Hover: division wash, book wash, chapter wash (under the lines).
  const hover = state.hover;
  const hd = hover ? MODEL.divisions[hover.divisionIndex] : null;
  const hb = hover ? MODEL.books[hover.bookIndex] : null;
  const divA = fade('hover-division', hd ? 1 : 0, 240), shownDiv = remember('division', hd);
  if (divA > 0 && shownDiv) {
    ctx.globalAlpha = .018 * divA; ctx.fillStyle = palette.ink;
    ctx.beginPath(); shownDiv.books.forEach(rect); ctx.fill();
  }
  const bookA = fade('hover-book', hb ? 1 : 0, 180), shownBook = remember('book', hb);
  if (bookA > 0 && shownBook) {
    ctx.globalAlpha = .028 * bookA; ctx.fillStyle = palette.ink;
    ctx.beginPath(); rect(shownBook); ctx.fill();
  }
  if (hover) {
    ctx.globalAlpha = .07; ctx.fillStyle = palette.ink;
    ctx.beginPath(); rect(hover); ctx.fill();
  }

  // Chapter lines, fading in once cells are big enough not to become a haze.
  const lineA = Math.min(1, Math.max(0, (MODEL.chapterSide * k - 6) / 6));
  if (lineA > 0) {
    ctx.globalAlpha = lineA; ctx.strokeStyle = palette['line-ch']; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const b of books) for (const c of b.chapters) if (onScreen(c)) rect(c);
    ctx.stroke();
  }

  // Book borders in their colour; a hovered division's books brighten.
  const litA = fade('lit', hd ? 1 : 0, 180), litDiv = remember('lit', hd);
  ctx.lineWidth = 1;
  for (const b of books) {
    const c = colourOf(b);
    const lit = litDiv && b.divisionIndex === litDiv.index ? litA : 0;
    ctx.globalAlpha = c ? .7 + .3 * lit : 1;
    ctx.strokeStyle = c || palette['line-bk'];
    ctx.beginPath(); rect(b); ctx.stroke();
  }

  // Division boundaries, then testament boundaries: stronger, then strongest.
  ctx.globalAlpha = 1;
  ctx.strokeStyle = palette['line-dv']; ctx.lineWidth = 1.25; ctx.lineCap = 'square';
  ctx.beginPath();
  for (const sg of prepared.divisionSegments) { ctx.moveTo(X(sg.x1), Y(sg.y1)); ctx.lineTo(X(sg.x2), Y(sg.y2)); }
  ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.strokeStyle = palette['line-ts']; ctx.lineWidth = 1.5;
  ctx.beginPath(); MODEL.testaments.forEach(rect); ctx.stroke();

  // Hovered book outline.
  if (bookA > 0 && shownBook) {
    ctx.globalAlpha = bookA; ctx.strokeStyle = colour(shownBook, palette.ink); ctx.lineWidth = 1;
    ctx.beginPath(); rect(shownBook); ctx.stroke();
  }

  // Selection: its book outlined, the chapter filled and outlined.
  const sel = state.selected;
  if (sel) {
    const sb = MODEL.books[sel.bookIndex], c = colour(sb, palette.ink);
    ctx.globalAlpha = 1; ctx.strokeStyle = c; ctx.lineWidth = 1.5;
    ctx.beginPath(); rect(sb); ctx.stroke();
    ctx.fillStyle = c; ctx.globalAlpha = .1;
    ctx.beginPath(); rect(sel); ctx.fill();
    ctx.globalAlpha = 1; ctx.lineWidth = 1; ctx.stroke();
  }

  // Centre marks: stars, crossfading to numbers once numbers are legible.
  if (CONFIG.showMarks) {
    const numA = fade('numbers', numbersOn ? 1 : 0, 220);
    if (numA < 1) {
      const dot = starDot();
      ctx.globalAlpha = (1 - numA) * CONFIG.markOpacity;
      for (const b of books) {
        ctx.fillStyle = colour(b, palette.ink);
        ctx.beginPath();
        for (const c of b.chapters) {
          const r = dot * prepared.s[c.index] / 2, x = X(c.centerX), y = Y(c.centerY);
          if (x < -r || y < -r || x > W + r || y > H + r) continue;
          ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
        }
        ctx.fill();
      }
    }
    if (numA > 0) {
      const nz = numberDamping();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let font = '';
      for (const b of books) {
        ctx.fillStyle = colour(b, palette.ink);
        for (const c of b.chapters) {
          if (!onScreen(c)) continue;
          const px = Math.round(prepared.fs[c.index] * k * nz * 2) / 2;
          if (px < 2) continue;
          const strong = c === sel || c === hover;     // hovered and selected numbers brighten
          const f = `${strong ? 500 : 400} ${px}px ${palette.font}`;
          if (f !== font) { ctx.font = f; font = f; }
          ctx.globalAlpha = numA * (strong ? 1 : CONFIG.markOpacity);
          ctx.fillText(c.chapter, X(c.centerX), Y(c.centerY));
        }
      }
    }
  }

  // Layers from things built on the map (the game).
  for (const layer of worldLayers) {
    ctx.globalAlpha = 1; ctx.setLineDash([]);
    layer({ ctx, rect, colour, palette });
  }

  // Focus veil: dim the world outside what we are looking at. The hole is
  // the focus's true shape (a division is the union of its books).
  const region = focusRegion();
  const veilA = fade('veil', region ? 1 : 0, 500), shownRegion = remember('region', region);
  if (veilA > 0 && shownRegion) {
    ctx.globalAlpha = .66 * veilA; ctx.fillStyle = palette.bg;
    ctx.beginPath(); ctx.rect(0, 0, W, H); shownRegion.forEach(rect);
    ctx.fill('evenodd');
  }
  ctx.globalAlpha = 1;
}

// Label measurement (for "only where space permits").
const measureCtx = document.createElement('canvas').getContext('2d');
let labelPxCache = null;   // cleared on resize
const labelPx = () => (labelPxCache ??= parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--label-px')) || 9);
function measure(text, px, spacingEm) {
  measureCtx.font = `400 ${px}px ${getComputedStyle(document.body).fontFamily}`;
  return measureCtx.measureText(text).width + text.length * px * spacingEm;
}

const labels = { testaments: [], books: [], chapters: [] };

function createLabels(model) {
  for (const id of ['testament-labels', 'book-labels', 'chapter-nums']) $(id).replaceChildren();
  labels.testaments = []; labels.books = []; labels.chapters = [];
  numSelected = null;
  const px = labelPx();

  model.testaments.forEach((t) => {
    const el = svgEl('text', { class: 'testament-label' }, $('testament-labels'));
    el.textContent = t.name.toUpperCase();
    labels.testaments.push({ t, el });
  });
  model.books.forEach((b) => {
    // A label sits on the book's top boundary, on a patch of background.
    // Where the name won't fit, the canonical number alone may.
    const g = svgEl('g', { visibility: 'hidden' }, $('book-labels'));
    tint(g, b);
    const bg = svgEl('rect', { class: 'label-bg', y: -px * .67, height: px * 1.33 }, g);
    const el = svgEl('text', { class: 'book-label', x: 4 }, g);
    // Canonical book number first: 1.GEN, 2.EXO … 66.REV
    const full = `${b.index + 1}.${CONFIG.bookLabels === 'short' ? b.key : b.name}`.toUpperCase();
    labels.books.push({ b, g, bg, el, text: { full, num: String(b.index + 1) }, width: {}, mode: null });
  });
  // With star marks, chapter numbers sit in each cell's corner, revealed
  // wherever cells are big enough on screen. (Number marks make them redundant.)
  if (!useNumbers()) model.chapters.forEach((c) => {
    const el = svgEl('text', { class: 'chapter-num', visibility: 'hidden' }, $('chapter-nums'));
    el.textContent = c.chapter;

// The screen-space overlay: labels and rings, positioned for the camera.

    el.setAttribute('transform', `translate(${x} ${y}) rotate(-90)`);

      on = x < viewport.w && y < viewport.h && x + c.width * k > 0 && y + c.height * k > 0;

// Draw now: the world and its overlay, for the current camera and state.
function renderNow() {

}

// however many changes arrive before it (a pinch sends many).

  requestAnimationFrame(renderNow);
}

// Everything that depends on hover / selection / focus state (outside the

  for (const id of ['hover-star', 'hover-halo']) tint($(id), hb);

  const s = state.selected;
  tint($('sel-ring'), s && MODEL.books[s.bookIndex]);

  labels.books.forEach(({ b, el }) => {
    el.classList.toggle('hover', hb === b);
    el.classList.toggle('selected', !!s && s.bookIndex === b.index);
  });
  labels.testaments.forEach(({ t, el }) => el.classList.toggle('selected', !!s && s.testamentId === t.id));
  syncSelectionClasses();

  $('hint').classList.toggle('away', hintDismissed || state.focus.level !== 'bible' || !!s);

  // Selection context. The division and book lines are also ways in.
  const info = $('info');
  info.replaceChildren();
  if (s) {
    const sb = MODEL.books[s.bookIndex], sd = MODEL.divisions[s.divisionIndex];
    [[s.testament], [sd.name, () => focusDivision(sd)], [sb.name, () => focusBook(sb)], [`Chapter ${s.chapter}`]]
      .forEach(([text, go]) => {
        const div = Object.assign(document.createElement('div'), { textContent: text });
        if (go) { div.dataset.go = ''; div.onclick = go; }

  }
  if (f.book) crumbs.push([narrow ? f.book.key : f.book.name, () => focusBook(f.book)]);
  if (f.chapter) crumbs.push([String(f.chapter.chapter), () => {}]);

  nav.replaceChildren();
  crumbs.forEach(([text, go], i) => {
    if (i) nav.appendChild(Object.assign(document.createElement('i'), { textContent: '/' }));
    const span = Object.assign(document.createElement('span'), { textContent: text });
    if (i === crumbs.length - 1) span.className = 'current';
    else if (!go) span.className = 'static';

// Anything built on the map (the game) can follow its state here, and
// recompute its own world layers whenever the world (layout) changes.
const mapListeners = [], worldListeners = [];

let numSelected = null;

  if (s) labels.chapters[s.index]?.el.classList.add('selected');

// Switch between the portrait and landscape worlds. Objects are carried
// across by identity (their canonical index), never by coordinates.
function useLayout(name) {
  const from = MODEL;

    const same = (list, x) => (x ? MODEL[list][x.index] : null);
    const f = state.focus;
    state.selected = same('chapters', state.selected);
    state.hover = null;
    state.focus = { level: f.level, division: same('divisions', f.division),
                    book: same('books', f.book), chapter: same('chapters', f.chapter) };

/* =====================================================================
   6. INTERACTION
   Mouse: hover reveals, click selects, a second click enters; drag pans
   and the wheel zooms. Touch: pinch and drag move freely; a tap selects
   (showing its label above the finger), a second tap enters;
   press-and-hold scrubs across chapters. Back steps out. None of

const state = {

// The focused region's true shape, as rectangles (null: the whole Bible).

  const f = state.focus;

  if (f.level === 'division') return f.division.books;

  const f = state.focus;

  if (f.level === 'book') return frame(f.book, { extra: 24, fill: .72 });
  if (f.level === 'division') return frame(f.division.bounds, { extra: 16, fill: .9 });

const focusDivision = (d, o) => setFocus('division', { division: d }, o);
const focusBook     = (b, o) => setFocus('book', { division: divisionOf(b), book: b }, o);

const tooltip = $('tooltip');

const chapterRef = (c) => `${c.book === 'Psalms' ? 'Psalm' : c.book} ${c.chapter}`;

// Beside the cursor for a mouse; above the finger when scrubbing, where

function showTooltip(c, sx, sy, { aboveFinger = false } = {}) {

  if (!c) return;
  tooltip.querySelector('.d').textContent = c.division;
  tooltip.querySelector('.b').textContent = chapterRef(c);
  tint(tooltip, MODEL.books[c.bookIndex]);
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  let x, y;

// --- Mouse hover ---

const pointer = { x: 0, y: 0, inside: false };       // the mouse, when over the map

  showTooltip(c, pointer.x, pointer.y);

      gesture.hold = setTimeout(() => {

/* =====================================================================
   7. GAME (proof of concept)
   A Wordle-like layer on top of the map: guess the chapter from a short
   summary in CONFIG.game.maxGuesses tries. It uses the map only through
   its public surface: the selection (state.selected, select), camera focus
   (focusChapter, focusBible), the model, and the listeners above. Game
   state is held by canonical chapter index, so it survives a layout switch.
   ===================================================================== */

// Today's puzzle. (The full game will choose one per day.)
const PUZZLE = { chapter: 'REV.11', clue: 'A cosmic battle ensues between good and evil' };

const game = { answer: -1, guesses: [], over: false, won: false };

const chapterById = (id) => {
  const [key, n] = id.split('.');
  return MODEL.books.find((b) => b.key === key)?.chapters[Number(n) - 1] ?? null;
};
const guessed = (c) => game.guesses.some((g) => g.index === c.index);

// A guess's feedback: which levels of the hierarchy it shares with the
// answer, and whether the answer comes earlier or later in canonical order.
function judge(c, answer) {
  return {
    index: c.index,
    testament: c.testamentId === answer.testamentId,
    division: c.divisionId === answer.divisionId,
    book: c.bookIndex === answer.bookIndex,
    direction: answer.index > c.index ? 'later' : answer.index < c.index ? 'earlier' : 'here',
  };
}

// Is chapter c still consistent with every guess so far?
function stillPossible(c) {
  return game.guesses.every((g) => {
    const x = MODEL.chapters[g.index];
    if (c === x) return false;
    return (c.testamentId === x.testamentId) === g.testament
      && (c.divisionId === x.divisionId) === g.division
      && (c.bookIndex === x.bookIndex) === g.book
      && (g.direction === 'later' ? c.index > x.index : c.index < x.index);
  });
}

function makeGuess() {
  const c = state.selected;
  if (game.over || !c || guessed(c)) return;
  const answer = MODEL.chapters[game.answer];
  game.guesses.push(judge(c, answer));
  if (c === answer) game.over = game.won = true;
  else if (game.guesses.length >= CONFIG.game.maxGuesses) game.over = true;
  renderGame();
  renderGameMap();
  // Reveal: fly to the answer's book, so it's seen among its neighbours
  // (and any nearby guesses) rather than filling the screen alone.
  if (game.over) { select(answer); focusBook(MODEL.books[answer.bookIndex]); }
}

function resetGame() {
  Object.assign(game, { guesses: [], over: false, won: false });
  select(null);
  renderGame();
  renderGameMap();
  focusBible();
}

// --- Game rendering: chrome ---

  const n = game.guesses.length, max = CONFIG.game.maxGuesses;
  const answer = MODEL.chapters[game.answer];
  $('game-meta').textContent = game.won ? `Solved in ${n} of ${max}`
    : game.over ? 'Out of guesses'
    : `Guess ${n + 1} of ${max}`;
  $('clue').textContent = PUZZLE.clue;
  $('answer').textContent = game.over ? chapterRef(answer) : '';
  tint($('answer'), game.over ? MODEL.books[answer.bookIndex] : null);

  // Rows: a legend, the guesses so far, then empty slots, so the tray never
  // changes height (and the map never shifts) as guesses are made.
  const rows = [
    `<div class="legend-caption">■ = same testament · division · book</div>`,
    `<div class="guess-row legend"><span></span><span><span>T</span><span>D</span><span>B</span></span><span></span></div>`,
  ];
  for (let i = 0; i < max; i++) {
    const g = game.guesses[i];
    if (!g) {
      rows.push(`<div class="guess-row empty"><span>·</span><span>${'<i class="fb"></i>'.repeat(3)}</span><span></span></div>`);
      continue;
    }
    const c = MODEL.chapters[g.index];
    const fb = [g.testament, g.division, g.book].map((ok) => `<i class="fb${ok ? ' yes' : ''}"></i>`).join('');
    // The word is dropped on phones, leaving the arrow.
    const dir = g.direction === 'here' ? '✓<span class="w"> found</span>'
      : g.direction === 'later' ? '<span class="w">later </span>→' : '←<span class="w"> earlier</span>';
    rows.push(`<div class="guess-row${g.direction === 'here' ? ' found' : ''}"><span>${shortRef(c)}</span><span>${fb}</span><span class="dir">${dir}</span></div>`);
  }
  $('guess-rows').innerHTML = rows.join('');
  renderGuessButton();
}

// The Guess button follows the selection on the map.
function renderGuessButton() {
  const btn = $('guess-btn'), c = state.selected;
  const [label, enabled] = game.over ? ['Play again', true]
    : !c ? ['Select a chapter', false]
    : guessed(c) ? [`${chapterRef(c)} · already guessed`, false]
    : [`Guess ${chapterRef(c)}`, true];
  if (btn.textContent !== label) btn.textContent = label;
  btn.disabled = !enabled;
}

// --- Game rendering: world layers, painted into the map's canvas ---

// Recomputed on every guess and whenever the world (layout) changes.
const gameLayer = { ruledOut: [], guessed: [], answer: null };

function renderGameMap() {
  if (!MODEL || !CONFIG.game.enabled) return;
  // Ruled out: whole books where every chapter is out, otherwise chapters.
  const out = [];
  if (CONFIG.game.dimRuledOut && game.guesses.length && !game.over) {
    for (const b of MODEL.books) {
      const gone = b.chapters.filter((c) => !stillPossible(c));
      if (gone.length === b.chapters.length) out.push(b); else out.push(...gone);
    }
  }
  const answer = MODEL.chapters[game.answer];
  gameLayer.ruledOut = out;
  gameLayer.guessed = game.guesses.map((g) => MODEL.chapters[g.index]).filter((c) => c !== answer);
  gameLayer.answer = game.over ? answer : null;
  renderCamera();
}

function paintGameLayers({ ctx, rect, colour, palette }) {
  if (gameLayer.ruledOut.length) {
    ctx.globalAlpha = .62; ctx.fillStyle = palette.bg;
    ctx.beginPath(); gameLayer.ruledOut.forEach(rect); ctx.fill();
  }
  if (gameLayer.guessed.length) {
    ctx.globalAlpha = 1; ctx.strokeStyle = palette.ink; ctx.lineWidth = 1.25; ctx.setLineDash([3, 2]);
    ctx.beginPath(); gameLayer.guessed.forEach(rect); ctx.stroke();
    ctx.setLineDash([]);
  }
  const a = gameLayer.answer;
  if (a) {
    const c = colour(MODEL.books[a.bookIndex], palette.ink);
    ctx.fillStyle = c; ctx.strokeStyle = c;
    ctx.beginPath(); rect(a);
    ctx.globalAlpha = .12; ctx.fill();
    ctx.globalAlpha = 1; ctx.lineWidth = 2; ctx.stroke();
  }
}

// Screen space the game's chrome takes, so the map frames around it.
function measureGameChrome() {
  if (!CONFIG.game.enabled) { gameChrome = null; return; }
  const top = $('top').getBoundingClientRect(), tray = $('game-tray').getBoundingClientRect();
  gameChrome = { top: top.bottom + 14, below: isNarrow(), bottom: viewport.h - tray.top + 12, left: tray.right + 40 };
}

function startGame() {
  document.body.classList.add('game');
  game.answer = chapterById(PUZZLE.chapter).index;
  $('guess-btn').onclick = () => (game.over ? resetGame() : makeGuess());
  mapListeners.push(renderGuessButton);
  worldListeners.push(renderGameMap);
  worldLayers.push(paintGameLayers);
  renderGame();
  measureGameChrome();
}


/* =====================================================================
   START
   ===================================================================== */

let MODELS = null;

async function start() {
  try {
    const [bible, colours] = await Promise.all([loadBible('bible.json'), loadColours('colours.json')]);
    COLOURS = colours;
    MODELS = {};
    for (const [name, world] of Object.entries(WORLDS)) {
      const model = buildModel(bible, world);
      model.layout = name;
      model.chapterSide = Math.sqrt(model.chapters[0].width * model.chapters[0].height);
      checkModel(model, bible);
      MODELS[name] = model;
    }
    // Both layouts hold the same objects in the same canonical order.
    console.assert(MODELS.portrait.chapters.every((c, i) => {
      const o = MODELS.landscape.chapters[i];
      return c.bookKey === o.bookKey && c.chapter === o.chapter && c.divisionId === o.divisionId;
    }), 'portrait and landscape should share chapter identity');
  } catch (err) {
    console.error(err);
    $('info').innerHTML = location.protocol === 'file:'
      ? '<div>bible.json cannot be read from file://</div><div>serve this folder, e.g.</div><div>python3 -m http.server</div>'
      : `<div>Could not load bible.json</div><div>${err.message}</div>`;
    return;
  }
  if (CONFIG.colours) {
    const missing = MODELS.landscape.books.filter((b) => !COLOURS[b.key]).map((b) => b.key);
    if (missing.length) console.warn('No colour for:', missing.join(', '));
  }
  document.body.classList.toggle('no-marks', !CONFIG.showMarks);
  readPalette();
  sizeCanvas();
  $('hint').textContent = COARSE
    ? 'tap to select · pinch to zoom · hold to scan'
    : 'click to select · again to enter · scroll to zoom · esc to return';
  measureSafeArea();
  if (CONFIG.game.enabled) { MODEL = MODELS[layoutFor()]; startGame(); }
  useLayout(layoutFor());
  if (location.hash) applyHash({ history: 'none', animate: false });   // deep link
  document.fonts?.ready.then(() => {
    measureLabels();
    measureGameChrome();                       // the clue's height depends on the font
    if (!camera.free) Object.assign(camera, cameraForFocus());
    renderCamera();
  });
}

start();
</script>
